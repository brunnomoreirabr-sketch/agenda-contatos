name: Pacote Windows
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pacote:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install pyinstaller==6.16.0
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name AgendaContatos agenda.py
      - name: Preparar ZIP
        shell: pwsh
        run: |
          Copy-Item instalar_windows.ps1 dist/
          Copy-Item 'Instalar no Windows.bat' dist/
          Copy-Item LEIA-ME-WINDOWS.txt dist/
          Compress-Archive -Path dist/* -DestinationPath AgendaContatos-Windows.zip
      - name: Verificar instalação e atalho
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'agenda-install'
          & ./dist/instalar_windows.ps1
          $desktop = [Environment]::GetFolderPath('Desktop')
          $link = Join-Path $desktop 'Agenda de Contatos.lnk'
          if (!(Test-Path $link)) { throw 'O atalho nao foi criado.' }
          $shell = New-Object -ComObject WScript.Shell
          $shortcut = $shell.CreateShortcut($link)
          $expected = Join-Path $env:LOCALAPPDATA 'Programs/AgendaContatos/AgendaContatos.exe'
          if ($shortcut.TargetPath -ne $expected) { throw 'O atalho aponta para o local errado.' }
          $app = Start-Process $shortcut.TargetPath -WorkingDirectory $shortcut.WorkingDirectory -PassThru
          try {
            Start-Sleep -Seconds 8
            $app.Refresh()
            if ($app.HasExited) { throw 'A agenda fechou durante a inicializacao.' }
            $db = Join-Path $env:LOCALAPPDATA 'AgendaContatos/contatos.sqlite3'
            if (!(Test-Path $db)) { throw 'O banco local nao foi criado.' }
          } finally {
            if (!$app.HasExited) { Stop-Process $app.Id }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: AgendaContatos-Windows
          path: AgendaContatos-Windows.zip
      - name: Publicar pacote
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" AgendaContatos-Windows.zip --title "Agenda de Contatos $GITHUB_REF_NAME" --notes-file LEIA-ME-WINDOWS.txt
